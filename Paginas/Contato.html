<body>
  <header>
    <nav>
      <div class="links_nav">
        <img class="logo" src="/Fotos/Ford_logo.png" alt="foto_logo_ford" />
        <ul class="links">
          <li><a class="link a" href="index.html">Home</a></li>
          <li><a class="link a" href="lancamento.html">Lançamento</a></li>
          <li><a class="link a" href="Contato.html">Contato</a></li>
        </ul>
      </div>
    </nav>
  </header>
  <hr>
  <main class="conteudo-principal">
    <section class="ssmodal">

      <div class="container_modal">

        <div class="flex_elementos">

          <img src="/Fotos/storm.jpg" alt="Ford Ranger" />

          <form action="" class="formulario">

            <h3>Sobre Você:</h3>

            <input type="text" id="nome" name="nome" placeholder="NOME" required>

            <input type="email" id="email" name="email" placeholder="E-MAIL" required>

            <input type="tel" id="telefone" name="telefone" placeholder="TELEFONE" required>

            <select id="tipo-contato" name="tipo-contato" required>
              <option value="">TIPO DE CONTATO</option>
              <option value="elogio">Elogio</option>
              <option value="reclamacao">Reclamação</option>
              <option value="solicitacao">Solicitação</option>
            </select>

            <textarea id="mensagem" name="mensagem" placeholder="MENSAGEM" required></textarea>

            <span class="btn_contato">
              <button type="submit">Enviar</button>
            </span>

          </form>

        </div>

      </div>

    </section>
  </main>

  <!-- colocar target blank nos icones pra pg da ford -->
